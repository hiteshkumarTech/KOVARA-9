schema_version: 1
algorithm: shared-actor-centralized-critic-ppo
environment_config: ../environments/grid_rescue_easy.yaml
validation_config: ../evaluation/training_validation_smoke.yaml
network:
  actor_hidden_sizes: [64, 64]
  critic_hidden_sizes: [64, 64]
  activation: tanh
rollout_length: 8
num_environments: 1
ppo_epochs: 2
minibatch_size: 16
discount_factor: 0.99
gae_lambda: 0.95
normalize_advantages: true
advantage_normalization_epsilon: 0.00000001
clipping_coefficient: 0.2
entropy_coefficient: 0.01
value_coefficient: 0.5
maximum_gradient_norm: 0.5
learning_rate: 0.0003
total_environment_steps: 64
checkpoint_frequency: 32
evaluation_frequency: 32
device: cpu
deterministic_torch: true
seed: 0
