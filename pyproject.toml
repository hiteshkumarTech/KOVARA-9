[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kovara9"
version = "0.1.0"
description = "Reproducible multi-agent RL research platform for cooperative exploration in procedural environments."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "KOVARA-9 Contributors" }]
maintainers = [{ name = "Hitesh Kumar" }]
keywords = [
  "multi-agent reinforcement learning",
  "PettingZoo",
  "procedural generation",
  "reproducible research",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "gymnasium>=1.1,<2",
  "numpy>=2,<3",
  "pettingzoo>=1.24,<2",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "structlog>=25,<26",
  "torch>=2.7,<3",
  "typer>=0.16,<1",
]

[project.urls]
Documentation = "https://github.com/hiteshkumarTech/KOVARA-9#readme"
Issues = "https://github.com/hiteshkumarTech/KOVARA-9/issues"
Repository = "https://github.com/hiteshkumarTech/KOVARA-9"

[project.scripts]
kovara9 = "kovara9.cli:app"

[dependency-groups]
dev = [
  "hatchling>=1.27,<2",
  "hypothesis>=6.130,<7",
  "mypy>=1.15,<2",
  "pre-commit>=4.2,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-pyyaml>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kovara9"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A",
  "B",
  "C4",
  "E",
  "F",
  "FA",
  "I",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "RUF",
  "SIM",
  "T20",
  "UP",
  "W",
]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["kovara9"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pettingzoo.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=kovara9 --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
markers = [
  "integration: cross-component integration tests",
]

[tool.coverage.run]
branch = true
source = ["kovara9"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]
